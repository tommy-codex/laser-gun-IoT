<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Laser Gun - Control Pad</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <div id="status">
    <span id="statusDot" class="dot"></span>
    <span id="statusLabel">Demo</span>
  </div>
  <div id="modeSwitch">
    <button id="modeHardwareBtn" class="modeBtn">Hardware</button>
    <button id="modeDemoBtn" class="modeBtn active">Demo</button>
  </div>
</header>

<main id="stage">
  <canvas id="robotCanvas"></canvas>
</main>

<div id="fireStick" class="stick-zone">
  <div class="stick-label">FUOCO</div>
  <div class="stick-base">
    <div class="stick-knob" id="fireKnob"></div>
  </div>
</div>

<div id="aimStick" class="stick-zone">
  <div class="stick-label">MIRA</div>
  <div class="stick-base">
    <div class="stick-knob" id="aimKnob"></div>
  </div>
</div>

<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
